<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Claude</title>
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --text: #2d2a26;
    --text-soft: #6f6a62;
    --accent: #c15f3c;
    --accent-soft: #f4e8e2;
    --border: #e6e2da;
    --code-bg: #f1efe9;
    --shadow: 0 1px 3px rgba(45, 42, 38, 0.08), 0 8px 24px rgba(45, 42, 38, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1e1b;
      --surface: #2a2925;
      --text: #ece9e2;
      --text-soft: #a39d92;
      --accent: #d97b55;
      --accent-soft: #3a2f29;
      --border: #3b3934;
      --code-bg: #34322d;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px 14px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header h1 .spark { color: var(--accent); }
  header p { margin: 2px 0 0; font-size: 0.8rem; color: var(--text-soft); }

  main {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .thread {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .empty {
    margin: 14vh auto 0;
    text-align: center;
    color: var(--text-soft);
    max-width: 420px;
  }
  .empty .glyph { font-size: 2rem; color: var(--accent); font-family: Georgia, serif; }
  .empty h2 { font-family: Georgia, serif; font-weight: 500; color: var(--text); margin: 8px 0 6px; }
  .empty p { font-size: 0.9rem; margin: 0; }

  .msg { display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
    border-radius: 18px 18px 4px 18px;
    padding: 10px 16px;
    max-width: 80%;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .msg.assistant .who {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .msg.assistant .bubble { max-width: 100%; overflow-wrap: break-word; }
  .msg.assistant .bubble > :first-child { margin-top: 0; }
  .msg.assistant .bubble > :last-child { margin-bottom: 0; }

  .bubble pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    font-size: 0.85rem;
  }
  .bubble code {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.88em;
  }
  .bubble :not(pre) > code {
    background: var(--code-bg);
    border-radius: 5px;
    padding: 1px 5px;
  }
  .bubble ul, .bubble ol { padding-left: 24px; }

  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    margin-left: 2px;
    background: var(--accent);
    border-radius: 2px;
    vertical-align: baseline;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .composer-wrap {
    position: sticky;
    bottom: 0;
    padding: 8px 20px 20px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .composer {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: flex-end;
    padding: 10px 10px 10px 18px;
    gap: 10px;
    transition: border-color 0.15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    max-height: 200px;
    padding: 4px 0;
  }
  textarea::placeholder { color: var(--text-soft); }
  button.send {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: opacity 0.15s, transform 0.1s;
  }
  button.send:hover:not(:disabled) { transform: translateY(-1px); }
  button.send:disabled { opacity: 0.4; cursor: default; }
  button.send svg { width: 18px; height: 18px; }
  .hint {
    max-width: 760px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-soft);
  }
</style>
</head>
<body>
<header>
  <h1><span class="spark">✳</span> Ask Claude</h1>
  <p>Helpful. Dryly witty. Streaming.</p>
</header>

<main id="main">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <div class="glyph">✳</div>
      <h2>What's on your mind?</h2>
      <p>Ask anything. Answers arrive as they're written, wit included at no extra charge.</p>
    </div>
  </div>
</main>

<div class="composer-wrap">
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  </form>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</div>

<script>
const thread = document.getElementById("thread");
const main = document.getElementById("main");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];
let busy = false;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Minimal markdown: code fences, inline code, bold, italic, lists, paragraphs.
function renderMarkdown(text) {
  const parts = text.split(/```/);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      // Code block: first line may be a language tag.
      const body = parts[i].replace(/^[a-zA-Z0-9_-]*\n/, "");
      html += "<pre><code>" + escapeHtml(body) + "</code></pre>";
      continue;
    }
    const blocks = escapeHtml(parts[i]).split(/\n{2,}/);
    for (let block of blocks) {
      if (!block.trim()) continue;
      block = block
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|\s)\*([^*\n]+)\*/g, "$1<em>$2</em>");
      const lines = block.split("\n");
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        html += "<ul>" + lines.map(l => "<li>" + l.replace(/^\s*[-*]\s+/, "") + "</li>").join("") + "</ul>";
      } else if (lines.every(l => /^\s*\d+\.\s+/.test(l))) {
        html += "<ol>" + lines.map(l => "<li>" + l.replace(/^\s*\d+\.\s+/, "") + "</li>").join("") + "</ol>";
      } else {
        html += "<p>" + block.replace(/\n/g, "<br>") + "</p>";
      }
    }
  }
  return html;
}

function addUserMessage(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  el.appendChild(bubble);
  thread.appendChild(el);
}

function addAssistantMessage() {
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = '<div class="who">Claude</div><div class="bubble"></div>';
  thread.appendChild(el);
  return el.querySelector(".bubble");
}

function scrollToBottom() {
  main.scrollTop = main.scrollHeight;
}

function setBusy(state) {
  busy = state;
  send.disabled = state || !input.value.trim();
}

async function submit() {
  const question = input.value.trim();
  if (!question || busy) return;

  document.getElementById("empty")?.remove();
  input.value = "";
  input.style.height = "auto";
  setBusy(true);

  history.push({ role: "user", content: question });
  addUserMessage(question);
  const bubble = addAssistantMessage();
  bubble.innerHTML = '<span class="cursor"></span>';
  scrollToBottom();

  let answer = "";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok || !res.body) {
      throw new Error("Request failed with status " + res.status);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      answer += decoder.decode(value, { stream: true });
      const stick = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
      bubble.innerHTML = renderMarkdown(answer) + '<span class="cursor"></span>';
      if (stick) scrollToBottom();
    }
    bubble.innerHTML = renderMarkdown(answer);
    history.push({ role: "assistant", content: answer });
  } catch (err) {
    bubble.innerHTML = renderMarkdown(answer) +
      '<p><em>Something went wrong: ' + escapeHtml(err.message) + '</em></p>';
    // Keep history consistent: drop the user turn that got no reply.
    if (!answer) history.pop();
    else history.push({ role: "assistant", content: answer });
  } finally {
    setBusy(false);
    input.focus();
  }
}

form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  send.disabled = busy || !input.value.trim();
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
});
</script>
</body>
</html>
